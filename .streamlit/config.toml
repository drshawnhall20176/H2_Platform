[theme]
base = "dark"
font = "sans serif"

[theme.dark]
primaryColor = "#1f6feb"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2b"
textColor = "#e6e6e6"
borderColor = "#2d3344"
baseRadius = "medium"

[theme.dark.sidebar]
backgroundColor = "#090b10"
secondaryBackgroundColor = "#161b26"
primaryColor = "#1f6feb"
textColor = "#c7ccd6"
borderColor = "#20293a"

[theme.light]
primaryColor = "#1f6feb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f9"
textColor = "#1a1f2b"
borderColor = "#dde1e8"
baseRadius = "medium"

[theme.light.sidebar]
backgroundColor = "#f3f5f9"
secondaryBackgroundColor = "#e8ebf1"
primaryColor = "#1f6feb"
textColor = "#333a47"
borderColor = "#d5dae3"
