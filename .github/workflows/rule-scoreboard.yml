# The H2 Rulebook's scoreboard (rule_scoreboard.py, Nov 26): every rule's forward record, trend and distance to its next
# gate, scored each morning after the review from the same graded picks the shut-off uses. Prints counts only.
name: rule-scoreboard

on:
  schedule:
    - cron: "40 11 * * *"    # ~6:40 AM ET, after the daily review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Score the rules
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python rule_scoreboard.py
