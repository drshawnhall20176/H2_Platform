# Script learn (Nov 7): the Game Script feedback loop (script_learn.py). Each run, per sport: add the games that
# finished, grade the pre-game scenario calls logged earlier, refit the scenario table / line curve / matchup
# challenger and the prop script effects (each tested on games it wasn't fit on), and log calls for today's and
# tomorrow's games. Twice a day: early morning (after the late games) and late afternoon (fresher lines for the
# evening's calls). The ESPN game cache rides between runs in actions/cache, so only new days are fetched.
name: script-learn

on:
  schedule:
    - cron: "17 10 * * *"   # 5:17am ET
    - cron: "17 21 * * *"   # 4:17pm ET
  workflow_dispatch: {}

concurrency:
  group: script-learn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sport: [NBA, NCAAMB, NFL, NCAAF, NHL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore game cache
        uses: actions/cache@v4
        with:
          path: .script_cache
          key: script-cache-${{ matrix.sport }}-${{ github.run_id }}
          restore-keys: script-cache-${{ matrix.sport }}-
      - name: Learn
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORT: ${{ matrix.sport }}
        run: python -u script_learn.py
