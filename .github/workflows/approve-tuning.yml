# Turn on owner-approved projection multipliers (approve_tuning.py) -- the same list Postgame Review shows under
# Approved adjustments, where any of them can be retired.
name: approve-tuning

on:
  workflow_dispatch:
    inputs:
      sport:
        required: true
      factors:
        description: 'JSON {"Points": 0.95} (or {"Market|slot": f})'
        required: true
      reason:
        required: true

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Approve
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FACTORS: ${{ inputs.factors }}
          REASON: ${{ inputs.reason }}
        run: python approve_tuning.py --sport "${{ inputs.sport }}" --factors "$FACTORS" --reason "$REASON"
