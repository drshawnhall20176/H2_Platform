# Nightly backup of the records (backup.py, Nov 21): the Bet Log, the shown-picks ledgers and every saved setting, the
# morning reviews, game picks, fits, and the last 3 slates' prop reads -- one gzipped JSON file a night, kept 90 days
# as this run's artifact (Actions -> backup -> a run -> Artifacts).
# The repository is PUBLIC, so anyone signed in to GitHub can download an artifact: the file is encrypted (AES-256)
# with the BACKUP_KEY secret before upload, and without that secret nothing is uploaded at all.
# Decrypt: openssl enc -d -aes-256-cbc -pbkdf2 -in FILE.json.gz.enc -out FILE.json.gz -pass pass:<BACKUP_KEY>
name: backup

on:
  schedule:
    - cron: "17 9 * * *"          # ~4-5 AM New York, after settlement and before the morning review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backup.py backups
      - name: Encrypt (no key, no upload)
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          if [ -z "$BACKUP_KEY" ]; then echo "BACKUP_KEY secret not set: nothing uploaded"; rm -rf backups; exit 1; fi
          for f in backups/*.json.gz; do
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$f.enc" -pass env:BACKUP_KEY && rm "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: h2-backup-${{ github.run_id }}
          path: backups/*.json.gz.enc
          retention-days: 90
          if-no-files-found: error
