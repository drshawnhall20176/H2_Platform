# What OddsPapi's free tier returns for UFC (oddspapi_probe.py, Nov 27) -- a one-off check, run by hand. Prints markets,
# books and one fight's DraftKings prices; never the key.
name: oddspapi-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ask OddsPapi about UFC
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python -u oddspapi_probe.py
