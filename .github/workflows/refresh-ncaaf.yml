# Auto-refresh the NCAAF roster + player season stats + schedule + per-game player stats +
# drives caches — entirely in the cloud, no local step. Same pattern as refresh-statcast.yml.
#
# WHAT IT DOES:
#   Once a day this pulls the season's roster, player season stats, schedule, and (for every
#   COMPLETED week) per-game player stats AND drive-level data from CollegeFootballData.com
#   (CFBD), writes data/ncaaf_rosters.csv, data/ncaaf_player_stats.csv, data/ncaaf_schedule.csv,
#   data/ncaaf_player_game_stats.csv, and data/ncaaf_drives.csv, and commits them back to the
#   repo. That commit triggers a Streamlit Cloud redeploy, so the deployed app picks up the
#   fresh files with zero manual work. The per-game cache is what upgrades ncaaf_projections.py
#   from a season-average parametric model to a real bootstrap (matching every other sport
#   here) and enables real Retrospective grading (ncaaf_engine.get_player_results) -- see both
#   modules' own docstrings. The drives cache is what powers the drive-level simulation build
#   (see ncaaf_engine.get_team_drive_outcomes' own docstring) -- added after this workflow was
#   first written, and a real, caught-late gap: refresh_ncaaf.py already pulled it, but this
#   workflow's own commit step didn't stage it until this fix, so it would have silently never
#   reached the deployed app even with everything else configured correctly.
#
#   A REAL, ONE-TIME EXTRA PULL, added directly on request, happens INSIDE refresh_ncaaf.py
#   itself (not a separate workflow step): the first time this ever runs, it also pulls the
#   PRIOR season's own complete per-game stats and drives, once, so the platform's own
#   2025-baseline toggle (QB Lab/Matchup Lab) has real data to show before the current season
#   has any completed games at all. Checked against the cache itself before fetching -- once
#   that prior season is on file, every later run skips it automatically, so this shows up as a
#   one-time spike in this workflow's own logged call count, not a recurring daily cost.
#
# WHY DAILY, NOT MORE OFTEN — A REAL BUDGET CONSTRAINT, NOT JUST "stable data, no rush":
#   CollegeFootballData's free tier is metered at roughly 1,000 API calls/month (confirmed
#   against CFBD's own published blog post at time of scoping). This workflow makes 3 calls for
#   roster/season-stats/schedule PLUS TWO calls per completed week (per-game stats AND drives,
#   added later -- this doubled the original per-week cost, recomputed here, not left stale).
#   Computed directly, not guessed: run daily every single day of a ~15-week season, that totals
#   roughly 1,815 calls for the ENTIRE season, averaging ~454/month across a ~4-month season --
#   still comfortably inside budget on average, but the LATE-season days cost meaningfully more
#   than that average suggests: once all 15 weeks are completed, a single day's pull alone is 33
#   calls, and sustaining that daily rate for a full month would be ~990 calls -- right at the
#   cap, not comfortably under it. If real usage printed in this workflow's own logs starts
#   running tight against the monthly cap, switching this to a weekly cadence is the first lever
#   -- per-game results and drive data don't change faster than weekly anyway once a week's
#   games are actually final.
#
# ONE-TIME SETUP (do this before the first run):
#   1) Add the CFBD_API_KEY secret (Settings -> Secrets and variables -> Actions) — get a free
#      key at collegefootballdata.com/key.
#   2) Commit this workflow file at .github/workflows/refresh-ncaaf.yml, and ncaaf_data.py /
#      refresh_ncaaf.py. (No .gitignore change needed — checked directly: this repo has no
#      .gitignore restricting data/, the same way data/statcast_batters.csv etc. are already
#      tracked plainly.)
#   3) Go to the repo's Actions tab -> "refresh-ncaaf" -> "Run workflow" to populate all five
#      files immediately (otherwise they first populate at the scheduled time below).
#
# NOTES:
#   - No app dependency added: requests + pandas are already in requirements.txt. The official
#     `cfbd` client package is deliberately NOT used and NOT installed here — it hard-pins
#     pydantic<2, which conflicts with nfl_engine.py's own nflreadpy dependency (pydantic>=2.0).
#     This was tested directly during scoping, not assumed: installing cfbd alongside nflreadpy
#     breaks `import nflreadpy` outright. See ncaaf_data.py's own docstring for the full story.
#   - Player season stats, schedule, and per-game stats refreshes are all non-fatal to the whole
#     job, same posture refresh_statcast.py already has for its own secondary pulls — the roster
#     cache still commits even if a later pull didn't produce a file this run. Per-game stats
#     specifically has nothing to pull at all before the season's first completed week — that's
#     expected, not an error, and the workflow says so rather than warning about it.

name: refresh-ncaaf

on:
  schedule:
    - cron: "0 11 * * *"     # 11:00 UTC daily (~6-7am ET)
  workflow_dispatch: {}       # manual "Run workflow" button in the Actions tab

permissions:
  contents: write             # allow the job to commit the refreshed CSVs back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir --upgrade pandas requests

      - name: Pull NCAAF roster + player season stats + schedule + per-game stats + drives and write the caches
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python refresh_ncaaf.py     # defaults to the current season; schedule and per-game
                                         # stats pulls are both non-fatal (see main()'s own
                                         # try/except) so this step still succeeds even if only
                                         # roster+stats land

      - name: Validate the roster + player stats caches with the app's own loader
        # Same "use the real loader, refuse to commit an empty/broken pull" posture the Statcast
        # workflow's own batter-cache validation has. Both are core dependencies for
        # ncaaf_engine.py, worth blocking the commit over if either looks wrong.
        run: |
          python - <<'PY'
          import sys
          import ncaaf_data as ND
          rosters = ND.load_rosters()
          stats = ND.load_player_stats()
          print(f"Loaded {len(rosters)} roster players, {len(stats)} players with season stats.")
          if len(rosters) < 100:
              print("Roster cache looks empty or too small (expected 1,000+ FBS players) — refusing to commit.")
              sys.exit(1)
          if len(stats) < 100:
              print("Player season stats cache looks empty or too small — refusing to commit.")
              sys.exit(1)
          PY

      - name: Validate the schedule + per-game stats caches (non-fatal — logs only, never blocks the commit)
        run: |
          python - <<'PY'
          import ncaaf_data as ND
          games = ND.load_schedule()
          print(f"Loaded {len(games)} scheduled games.")
          if len(games) < 50:
              print("::warning::Schedule cache looks thin or missing after this run — see the earlier pull step's own log for the actual error. Committing roster/stats caches anyway (non-fatal).")
          seasons_present = sorted({g.get("season") for g in games if g.get("season") is not None})
          stats = ND.load_player_stats()
          # UPDATED DIRECTLY: refresh_player_season_stats now ALWAYS keeps BOTH the target year
          # and year-1 (see its own docstring), so stats can genuinely contain rows from two
          # different seasons at once -- checking only stats[0]'s own season (the old logic) is
          # the same real "first row" hack already fixed in ncaaf_engine.py itself, and would
          # miss a real gap if, say, only the FALLBACK year's row happened to load first.
          stats_seasons_present = sorted({s.get("season") for s in stats if s.get("season") is not None})
          # Regression check for the real bug this workflow's own history recorded: the schedule
          # cache must include EVERY season player stats actually cover (target and/or fallback),
          # or ncaaf_engine's games-played denominator silently resolves to 0 for any team whose
          # own stats-season isn't covered, and that team's whole slate contribution goes empty.
          missing_seasons = set(stats_seasons_present) - set(seasons_present)
          if missing_seasons:
              print(f"::warning::Player stats cover season(s) {stats_seasons_present}, but the schedule cache is missing {sorted(missing_seasons)} entirely — this WILL produce zero plays for any team whose own stats resolve to a missing season (games-played resolves to 0 for that team). See refresh_ncaaf.py's own needed_years logic.")
          # A NEW, direct diagnostic added on request, after a real live incident this exact
          # check would have caught immediately instead of requiring a multi-step investigation:
          # team-level stats coverage, not just row counts. A file with "1,082 real rows" can
          # still cover almost none of the real teams that matter if it's concentrated in a
          # handful of programs -- exactly what happened live (37 FCS/D-II teams, 0 overlap with
          # the roster's 138 real FBS teams).
          roster = ND.load_rosters()
          roster_teams = {p.get("team") for p in roster if p.get("team")}
          stats_teams = {s.get("team") for s in stats if s.get("team")}
          covered = roster_teams & stats_teams
          print(f"Team-level stats coverage: {len(covered)}/{len(roster_teams)} real roster teams have at least one player with stats on file (either season).")
          if roster_teams and len(covered) < len(roster_teams) * 0.5:
              print(f"::warning::Fewer than half of real roster teams have ANY matched player-stats row in either season — a real, possible sign of a team-name mismatch or coverage gap between the roster and stats endpoints, worth a direct look before trusting today's slate.")
          game_stats = ND.load_player_game_stats()
          completed = sorted({g["week"] for g in games if g.get("completed") and g.get("week") is not None})
          print(f"Loaded {len(game_stats)} player-game row(s) across {len(completed)} completed week(s) (any season).")
          PY
        continue-on-error: true

      - name: Commit the refreshed caches (only if something changed)
        # Same atomic-git-add lesson refresh-statcast.yml's own comment records: `git add` with
        # multiple pathspecs fails ATOMICALLY if any one doesn't match a file on disk, silently
        # blocking the commit of files that DID succeed. Stage the two core files
        # unconditionally first, then only add schedule/per-game-stats/drives if they actually exist.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ncaaf_rosters.csv
          git add data/ncaaf_player_stats.csv
          if [ -f data/ncaaf_schedule.csv ]; then
            git add data/ncaaf_schedule.csv
          else
            echo "::warning::data/ncaaf_schedule.csv was not produced this run (see the pull step's own log for why) — committing roster/stats caches only."
          fi
          if [ -f data/ncaaf_player_game_stats.csv ]; then
            git add data/ncaaf_player_game_stats.csv
          else
            echo "No per-game stats cache yet (no completed weeks this season, or the pull failed — see the pull step's own log). Expected before the season's first completed week."
          fi
          if [ -f data/ncaaf_drives.csv ]; then
            git add data/ncaaf_drives.csv
          else
            echo "No drives cache yet (no completed weeks this season, or the pull failed — see the pull step's own log). Expected before the season's first completed week, same as per-game stats."
          fi
          if git diff --staged --quiet; then
            echo "No change in NCAAF caches — nothing to commit."
          else
            git commit -m "Auto-refresh NCAAF roster/player-stats/schedule/per-game-stats/drives caches ($(date -u +%Y-%m-%d))"
            git push
          fi
