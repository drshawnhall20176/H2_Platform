# What SportsGameOdds returns for UFC (sgo_probe.py, Nov 27) -- a one-off check, run by hand. Prints markets, books and
# one fight's DraftKings prices; never the key.
name: sgo-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ask SportsGameOdds about UFC
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python -u sgo_probe.py
