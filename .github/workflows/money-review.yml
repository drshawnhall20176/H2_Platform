# Weekly 💰 Money pick review (Nov 19): which sports get 💰 Money picks, re-decided every Monday from each sport's graded
# record at real prices (money_review.py). Kept on schedule by clockwork; a manual run re-decides now.
name: money-review

on:
  schedule:
    - cron: "15 10 * * 1"    # Mondays ~5:15 AM ET, before the morning brief
  workflow_dispatch:
    inputs:
      force:
        description: "1 = re-decide now, even if this week's review already ran"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Review
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE: ${{ github.event.inputs.force }}
        run: if [ "$FORCE" = "1" ]; then python money_review.py --force; else python money_review.py; fi
