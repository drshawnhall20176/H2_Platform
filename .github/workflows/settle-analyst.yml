# Grade the Analyst Record (settle_analyst.py) every morning, so the record doesn't depend on someone opening the
# Analyst Desk for each sport. Also on demand.
name: settle-analyst

on:
  schedule:
    - cron: "41 12 * * *"
  workflow_dispatch:
    inputs:
      max_days:
        default: "20"

permissions:
  contents: read

concurrency:
  group: settle-analyst
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Settle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          MAX_DAYS: ${{ inputs.max_days }}
        run: |
          python settle_analyst.py --max-days "${MAX_DAYS:-20}"
