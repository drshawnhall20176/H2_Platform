# Tuning report (tuning_report.py): calibration, profit at the posted price, closing-line value and the
# model-vs-books blend fit per market. Nov 14: DAILY (was Tuesdays) -- the owner wants the model to learn every day.
# Each proposal still applies itself only when it wins on held-out days (2 of 3 and overall), so a daily run can't
# chase one night's noise. 8:17 AM ET, or on demand.
name: tuning-report

on:
  schedule:
    - cron: "17 13 * * *"
  # GitHub skips busy scheduled runs: also run after each morning review; tuning_report.py does nothing when today's
  # report already exists (TRIGGER=workflow_run), so this is once a day.
  workflow_run:
    workflows: ["daily-review"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma-separated (blank = all)"
        default: ""
      days:
        description: "Look-back window in days"
        default: "28"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Report
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTS: ${{ inputs.sports }}
          DAYS: ${{ inputs.days }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python tuning_report.py ${SPORTS:+--sports "$SPORTS"} --days "${DAYS:-28}"
