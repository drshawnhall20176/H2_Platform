# Tennis (ATP/WTA) and international basketball (EuroLeague, NBL) tracking: refresh results, refit the models, price
# every upcoming match / game and grade finished ones (intl_picks.py). Every 3 hours, or on demand.
name: capture-intl

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      sports:
        description: "TENNIS,EUROLEAGUE,EUROCUP,BCL,FEC,EUROCUPW,NKL,ICELAND,BAHRAIN,ESTONIA1,QATAR,NBL,NCAAMB,NBA,NHL (blank = all)"
        default: ""

permissions:
  contents: read

concurrency:
  group: capture-intl
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTS: ${{ inputs.sports }}
        run: |
          python intl_picks.py "${SPORTS:-TENNIS,EUROLEAGUE,EUROCUP,BCL,FEC,EUROCUPW,NKL,ICELAND,BAHRAIN,ESTONIA1,QATAR,NBL,NCAAMB,NBA,NHL}"
