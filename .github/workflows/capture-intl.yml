# Tennis (ATP/WTA) and international basketball (EuroLeague, NBL) tracking: refresh results, refit the models, price
# every upcoming match / game and grade finished ones (intl_picks.py). Every 3 hours, or on demand.
name: capture-intl

on:
  schedule:
    - cron: "23 */3 * * *"
  # Nov 13: GitHub ran the 3-hourly schedule only every 6-9 hours, so International Hoops went stale. Other jobs
  # finishing also start it; intl_picks.py skips a run that comes within 150 minutes of the last one.
  workflow_run:
    # Nov 14: not daily-review / morning-brief -- daily-review starts after this job, so the two kept setting each other off
    workflows: ["warm-slates", "settle-results", "capture-closing-lines", "close-watch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sports:
        description: "TENNIS,EUROLEAGUE,EUROCUP,BCL,FEC,EUROCUPW,NKL,ICELAND,BAHRAIN,ESTONIA1,QATAR,NBL,NCAAMB,NBA,NHL (blank = all)"
        default: ""

permissions:
  contents: read

concurrency:
  group: capture-intl
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTS: ${{ inputs.sports }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python intl_picks.py "${SPORTS:-TENNIS,EUROLEAGUE,EUROCUP,BCL,FEC,EUROCUPW,NKL,ICELAND,BAHRAIN,ESTONIA1,QATAR,NBL,NCAAMB,NBA,NHL}"
      # Nov 13: the Soccer Lab (soccer_picks.py) -- results from ESPN (a ~13-month backfill the first run), one Odds API
      # call per league with a match on (Pinnacle + the US books, 3 credits), grading and bet settling.
      - name: Capture soccer
        if: always()
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f .skip-soccer ]; then echo "Skipped with the international capture (ran recently)."; else python soccer_picks.py; fi
